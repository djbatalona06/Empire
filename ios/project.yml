# Generate the Xcode project:  brew install xcodegen && cd ios && xcodegen
name: DealerDoor
options:
  bundleIdPrefix: com.dealerdoor
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # set your Apple Developer Team ID
targets:
  DealerDoor:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - DealerDoor
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dealerdoor.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: DealerDoor/Info.plist
        CODE_SIGN_ENTITLEMENTS: DealerDoor/DealerDoor.entitlements
      configs:
        Debug:
          API_BASE_URL: http://localhost:8787
          APS_ENVIRONMENT: development
        Release:
          API_BASE_URL: https://api.example.com
          APS_ENVIRONMENT: production
