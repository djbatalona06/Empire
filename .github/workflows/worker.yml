name: Worker API

on:
  pull_request:
    paths: ["worker/**", "admin/**", ".github/workflows/worker.yml"]
  push:
    branches: [main]
    paths: ["worker/**", "admin/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options: [staging, production]
        default: staging

defaults:
  run:
    working-directory: worker

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # main → staging automatically; production only by manual dispatch.
  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler d1 migrations apply DB --remote --env "$TARGET"
      - run: npx wrangler deploy --env "$TARGET"
