name: iOS app

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
      # Compile-only check for the simulator; signing and TestFlight upload happen in Xcode Cloud.
      - run: |
          xcodebuild -project DealerDoor.xcodeproj -scheme DealerDoor \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E ": error:" build.log | sort -u; tail -20 build.log; exit 1; }
          grep -E ": warning:" build.log | grep "/DealerDoor/" | sort -u || true
